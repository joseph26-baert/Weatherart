name: Œuvre du jour
on:
  schedule:
    - cron: '7 * * * *'      # toutes les heures (UTC), pour attraper minuit dans chaque fuseau
  workflow_dispatch:
permissions:
  contents: write
concurrency: jour
jobs:
  fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/jour.mjs
      - name: Enregistrer
        run: |
          git config user.name "weather-art-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jour.json
          git diff --cached --quiet || git commit -m "Œuvre du jour ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
