// Aucune dépendance. Fonctionne dans Node, dans un worker Cloudflare/Vercel, ou dans le navigateur.

// Flux : météo brute (Open-Meteo) → profil météo (0-10) → score de chaque œuvre

// ---------- 1. Profil météo ----------

// Codes WMO utilisés par Open-Meteo → étiquettes météo (les mêmes que dans `meteo_associee` de la base)
const WMO = {
  0: ['soleil', 'clair', 'beau_temps'],
  1: ['soleil', 'beau_temps'],
  2: ['variable', 'nuages'],
  3: ['nuages'],
  45: ['brouillard'], 48: ['brouillard'],
  51: ['bruine', 'pluie'], 53: ['bruine', 'pluie'], 55: ['bruine', 'pluie'],
  56: ['bruine', 'pluie', 'gel'], 57: ['bruine', 'pluie', 'gel'],
  61: ['pluie'], 63: ['pluie'], 65: ['pluie', 'averse'],
  66: ['pluie', 'gel'], 67: ['pluie', 'gel'],
  71: ['neige'], 73: ['neige'], 75: ['neige'], 77: ['neige'],
  80: ['averse', 'pluie'], 81: ['averse', 'pluie'], 82: ['averse', 'pluie', 'orage'],
  85: ['neige', 'averse'], 86: ['neige', 'averse'],
  95: ['orage', 'pluie'], 96: ['orage', 'pluie'], 99: ['orage', 'pluie'],
};

const WMO_LABELS_FR = {

  45: 'Brouillard', 48: 'Brouillard givrant',
  51: 'Bruine légère', 53: 'Bruine', 55: 'Bruine dense', 56: 'Bruine verglaçante', 57: 'Bruine verglaçante',
  61: 'Pluie légère', 63: 'Pluie', 65: 'Pluie forte', 66: 'Pluie verglaçante', 67: 'Pluie verglaçante',
  71: 'Neige légère', 73: 'Neige', 75: 'Neige forte', 77: 'Grains de neige',
  80: 'Averses légères', 81: 'Averses', 82: 'Averses violentes', 85: 'Averses de neige', 86: 'Averses de neige',
  95: 'Orage', 96: 'Orage avec grêle', 99: 'Orage avec grêle',
};

const clamp = (x, a = 0, b = 10) => Math.max(a, Math.min(b, x));

function saison(dateISO, latitude = 46) {
  const m = Number(dateISO.slice(5, 7));
  const nord = ['hiver', 'hiver', 'printemps', 'printemps', 'printemps', 'été', 'été', 'été', 'automne', 'automne', 'automne', 'hiver'][m - 1];
  if (latitude >= 0) return nord;
  return { hiver: 'été', été: 'hiver', printemps: 'automne', automne: 'printemps' }[nord];
}

/**
 * Construit le profil météo du jour.
 * @param {object} w  { temp, temp_ressentie, temp_max, temp_min, precip_mm, neige_cm, nuages_pct,
 *                      vent_kmh, humidite_pct, code_wmo, ensoleillement_h, is_day }
 * @param {string} dateISO 'YYYY-MM-DD' (dans le fuseau de la ville)
 * @param {number} latitude
 */
function profilMeteo(w, dateISO, latitude) {
  const labels = new Set(WMO[w.code_wmo] ?? ['variable']);
  const t = w.temp_ressentie ?? w.temp;
  const tmax = w.temp_max ?? w.temp;

  if (tmax >= 32) labels.add('canicule').add('chaleur');
  else if (tmax >= 26) labels.add('chaleur');
  else if (t >= 15 && t <= 25 && w.precip_mm < 0.5) labels.add('douceur');
  if (t <= 8) labels.add('froid');
  if (t <= 0 || (w.temp_min ?? 99) <= -1) labels.add('gel');
  if (w.vent_kmh >= 30) labels.add('vent');
  if (w.humidite_pct >= 85 && w.precip_mm > 0) labels.add('humide');
  if (w.vent_kmh < 12 && w.precip_mm < 0.2 && (w.code_wmo ?? 0) <= 3) labels.add('calme');
  if (w.is_day === 0 || w.is_day === false) labels.add('nuit');
  labels.add(saison(dateISO, latitude));

  const pluie = clamp(w.precip_mm >= 10 ? 10 : w.precip_mm * 1.6 + (labels.has('pluie') ? 3 : 0));
  const neige = clamp((w.neige_cm ?? 0) * 3 + (labels.has('neige') ? 5 : 0));
  const nuages = clamp(w.nuages_pct / 10);
  const luminosite = clamp(10 - nuages * 0.6 - pluie * 0.25 - neige * 0.1 - (labels.has('brouillard') ? 3 : 0));
  const chaleur = clamp((t - 5) / 3);          // 5°C → 0 ; 35°C → 10
  const froid = clamp((20 - t) / 2.5);         // 20°C → 0 ; -5°C → 10
  const vent = clamp(w.vent_kmh / 6);
  const humidite = clamp(w.humidite_pct / 10);
  const orage = labels.has('orage') ? 9 : 0;
  const calme = clamp(10 - vent - orage - pluie * 0.4);
  // ambiance perçue : joie ≈ lumière + douceur ; mélancolie ≈ gris + pluie + froid
  const joie = clamp(luminosite * 0.6 + (t >= 12 && t <= 28 ? 4 : 0) - pluie * 0.3);
  const melancolie = clamp(nuages * 0.4 + pluie * 0.4 + froid * 0.3 + (labels.has('brouillard') ? 2 : 0));

  return { labels: [...labels], pluie, neige, nuages, luminosite, chaleur, froid, vent, humidite, orage, calme, joie, melancolie, temp: t, saison: saison(dateISO, latitude) };
}

// ---------- 2. Scoring ----------

const sim = (a, b) => 1 - Math.abs(a - b) / 10;   // similarité 0..1 entre deux valeurs 0..10

const POIDS = { meteo: 0.35, temperature: 0.20, couleur: 0.15, saison: 0.10, ambiance: 0.10, diversite: 0.10 };

/**
 * Score détaillé d'une œuvre pour un profil donné (chaque composante 0..1).
 * @param {object} o  œuvre de la base
 * @param {object} p  profil météo
 * @param {object[]} historique  entrées récentes de la ville, du plus récent au plus ancien : [{id, artiste, categorie, jours}]
 */
function scoreOeuvre(o, p, historique = []) {
  const t = o.tags;

  // --- météo (35 %) : moitié dimensions, moitié étiquettes
  const dims = [
    [sim(p.pluie, t.eau_pluie), 1 + p.pluie / 5],
    [sim(p.neige, t.neige), 1 + p.neige / 3],
    [sim(p.vent + p.orage * 0.5, t.mouvement), 0.8],
    [sim(p.calme, t.calme), 0.8],
    [sim(p.nuages, 10 - t.ciel * 0.5 - t.luminosite * 0.5), 0.6],
  ];
  const dimScore = dims.reduce((s, [v, w]) => s + v * w, 0) / dims.reduce((s, [, w]) => s + w, 0);
  const communs = o.meteo_associee.filter(l => p.labels.includes(l)).length;
  const labelScore = communs === 0 ? 0.15 : Math.min(1, 0.55 + 0.25 * communs);
  const meteo = 0.5 * dimScore + 0.5 * labelScore;

  // --- température (20 %)
  const [tmin, tmax] = o.temperature;
  const dist = p.temp < tmin ? tmin - p.temp : p.temp > tmax ? p.temp - tmax : 0;
  const plage = Math.max(0, 1 - dist / 12);
  const temperature = 0.6 * plage + 0.4 * sim(p.chaleur, t.chaleur_visuelle);

  // --- couleurs / luminosité (15 %)
  // ciel gris → légère préférence pour tons froids/sombres, mais pas une règle absolue (cahier des charges §13-14)
  const froideur = p.froid * 0.5 + p.nuages * 0.3 + p.pluie * 0.2;
  const couleur = 0.55 * sim(p.luminosite, t.luminosite) + 0.45 * sim(froideur, t.couleurs_froides);

  // --- saison (10 %) : influence, pas obligation
  const saisonScore = o.saison_ideale.includes(p.saison) ? 1 : 0.45;

  // --- ambiance (10 %)
  const mauvaisTemps = (p.pluie + p.froid + p.nuages) / 30;   // 0..1
  const interieurBonus = mauvaisTemps > 0.5 ? (t.interieur / 10) * 0.5 : 0;
  const ambiance = Math.min(1, 0.45 * sim(p.joie, t.joie) + 0.45 * sim(p.melancolie, t.melancolie) + interieurBonus);

  // --- diversité (10 %) : mêmes artistes / même catégorie ces derniers jours
  let diversite = 1;
  for (const h of historique) {
    if (h.artiste === o.artiste && h.jours <= 7) diversite -= 0.5;
    if (h.jours === 1 && h.categorie === o.categorie) diversite -= 0.15;
    if (h.id === o.id && h.jours > 7) diversite -= 0.3;   // déjà vue ces deux derniers mois → on favorise les œuvres jamais montrées
  }
  diversite = Math.max(0, diversite);

  const base = POIDS.meteo * meteo + POIDS.temperature * temperature + POIDS.couleur * couleur
    + POIDS.saison * saisonScore + POIDS.ambiance * ambiance + POIDS.diversite * diversite;

  // --- anti-répétition (cahier des charges §11) : pénalité multiplicative selon la dernière apparition
  const derniere = historique.find(h => h.id === o.id);
  let penalite = 0;
  if (derniere) penalite = derniere.jours <= 1 ? 1 : derniere.jours === 2 ? 0.7 : derniere.jours === 3 ? 0.5 : derniere.jours <= 7 ? 0.25 : 0;

  return {
    id: o.id, score: base * (1 - penalite), base, penalite,
    detail: { meteo, temperature, couleur, saison: saisonScore, ambiance, diversite },
  };
}

// ---------- 3. Tirage déterministe ----------

function hash32(str) {           // FNV-1a
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function rng(seed) {             // mulberry32
  let a = hash32(seed);
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/**
 * Choisit l'œuvre du jour.
 * @param {object[]} oeuvres      base d'œuvres
 * @param {object|null} profil    profil météo (null si l'API météo est indisponible → niveau 2/3)
 * @param {object} ctx            { ville, dateISO, latitude, historique: [{id, artiste, categorie, jours}], topN }

function choisirOeuvre(oeuvres, profil, ctx) {

  const valides = oeuvres.filter(o => o.tags && imageOK(o.image?.url) && o.titre && o.artiste && o.annee && o.texte);

  const topN = ctx.topN ?? (valides.length > 40 ? 8 : 5);

  }

  let scores = valides.map(o => {
    const r = scoreOeuvre(o, p, ctx.historique ?? []);
    if (dejaAilleurs.has(o.id)) r.score *= 0.35;
    return r;

  let candidats = scores.slice(0, topN).filter(s => s.score > 0);

    niveau = 3;

  const r = rng(`${ctx.ville.toUpperCase()}+${ctx.dateISO}`)();
  const poids = candidats.map(c => Math.pow(c.score, 3));
  const total = poids.reduce((a, b) => a + b, 0);
  let acc = 0, choisi = candidats[candidats.length - 1];
  for (let i = 0; i < candidats.length; i++) { acc += poids[i] / total; if (r <= acc) { choisi = candidats[i]; break; } }

  const oeuvre = valides.find(o => o.id === choisi.id);
  return { oeuvre, niveau, profil: p, candidats, classement: scores, seed: `${ctx.ville.toUpperCase()}+${ctx.dateISO}` };
}

function profilSaisonnier(dateISO, latitude) {
  const s = saison(dateISO, latitude);
  const base = { labels: [s], pluie: 2, neige: 0, nuages: 5, luminosite: 6, chaleur: 5, froid: 4, vent: 2, humidite: 6, orage: 0, calme: 7, joie: 5, melancolie: 4, temp: 14, saison: s };
  if (s === 'hiver') Object.assign(base, { neige: 3, froid: 8, chaleur: 1, luminosite: 4, temp: 3, melancolie: 6, joie: 3 });
  if (s === 'été') Object.assign(base, { chaleur: 8, froid: 0, luminosite: 9, temp: 26, joie: 8, melancolie: 2, nuages: 3 });
  if (s === 'printemps') Object.assign(base, { luminosite: 7, temp: 15, joie: 7, pluie: 3 });
  if (s === 'automne') Object.assign(base, { pluie: 4, nuages: 6, luminosite: 5, temp: 11, melancolie: 6 });
  return base;
}

const ECHOS_GENERIQUES = {
  pluie: v => `Aujourd'hui, sous la pluie de ${v}, ce tableau prend une lumière différente.`,
  neige: v => `Avec la neige sur ${v}, cette œuvre semble avoir été choisie pour la journée.`,
  soleil: v => `Sous le soleil de ${v} aujourd'hui, ses couleurs paraissent plus vives.`,
  nuages: v => `Le ciel couvert de ${v} donne aujourd'hui à cette œuvre une tonalité plus feutrée.`,
  vent: v => `Le vent qui souffle sur ${v} fait écho à ce qui bouge dans cette image.`,
  froid: v => `Par ce froid sur ${v}, l'œuvre se regarde autrement.`,
  chaleur: v => `Avec la chaleur d'aujourd'hui à ${v}, cette image trouve un air de saison.`,
  brouillard: v => `Dans le brouillard de ${v}, ce tableau paraît plus proche que jamais.`,
  orage: v => `Sous le ciel d'orage de ${v}, cette œuvre a quelque chose d'électrique.`,
};
const PRIORITE = ['orage', 'neige', 'canicule', 'brouillard', 'pluie', 'averse', 'bruine', 'gel', 'vent', 'chaleur', 'froid', 'coucher_soleil', 'nuit', 'humide', 'douceur', 'soleil', 'beau_temps', 'clair', 'nuages', 'variable', 'calme', 'printemps', 'été', 'automne', 'hiver'];

function phraseEcho(oeuvre, profil, ville) {
  const ordre = PRIORITE.filter(l => profil.labels.includes(l));
  for (const l of ordre) if (oeuvre.echos_meteo?.[l]) return oeuvre.echos_meteo[l];
  for (const l of ordre) if (ECHOS_GENERIQUES[l]) return ECHOS_GENERIQUES[l](ville);
  return `Aujourd'hui à ${ville}, cette œuvre vous attendait.`;
}

/**
 * Retourne l'œuvre du jour, en la calculant une seule fois par (ville, date).
 * `store` = { get(cle) → enregistrement|null, set(cle, enregistrement), historique(ville, dateISO, n) → [{id, artiste, categorie, jours}] }
 */
async function oeuvreDuJour({ oeuvres, ville, dateISO, latitude, meteo, store, topN }) {
  const cle = `${ville.toUpperCase()}+${dateISO}`;
  const existant = await store.get(cle);
  // on réutilise l'enregistrement du jour, sauf s'il avait été calculé en mode secours (sans météo) et que la météo est maintenant disponible
  if (existant && !(existant.niveau > 1 && meteo)) return { ...existant, cache: true };

  const profil = meteo ? profilMeteo(meteo, dateISO, latitude) : null;
  const historique = await store.historique(ville, dateISO, 60);
  const dejaAujourdhui = store.dejaAujourdhui ? await store.dejaAujourdhui(ville, dateISO) : [];
  const res = choisirOeuvre(oeuvres, profil, { ville, dateISO, latitude, historique, topN, dejaAujourdhui });
  const enregistrement = {
    cle, ville, dateISO, oeuvre_id: res.oeuvre.id, artiste: res.oeuvre.artiste, categorie: res.oeuvre.categorie,
    niveau: res.niveau, profil: res.profil, meteo_brute: meteo ?? null,
    echo: phraseEcho(res.oeuvre, res.profil, ville),
    candidats: res.candidats.map(c => ({ id: c.id, score: +c.score.toFixed(3) })),
  };
  await store.set(cle, enregistrement);
  return { ...enregistrement, cache: false };
}

/** Store en mémoire (tests) ; en production : KV Cloudflare, Vercel KV, ou un simple fichier JSON. */
function storeMemoire(initial = {}) {
  const data = { ...initial };
  return {
    async get(k) { return data[k] ?? null; },
    async set(k, v) { data[k] = v; },
    async historique(ville, dateISO, n) {
      const out = [];
      const d0 = new Date(dateISO + 'T00:00:00Z');
      for (let j = 1; j <= n; j++) {
        const d = new Date(d0.getTime() - j * 86400000).toISOString().slice(0, 10);
        const e = data[`${ville.toUpperCase()}+${d}`];
        if (e) out.push({ id: e.oeuvre_id, artiste: e.artiste, categorie: e.categorie, jours: j });
      }
      return out;
    },
    async dejaAujourdhui(ville, dateISO) {   // œuvres des autres villes à J-1, J, J+1 (fuseaux horaires)
      const d0 = new Date(dateISO + 'T00:00:00Z'); const out = [];
      for (const j of [-1, 0, 1]) { const d = new Date(d0.getTime() + j * 86400000).toISOString().slice(0, 10);
        for (const [k, e] of Object.entries(data)) if (k.endsWith('+' + d) && !k.startsWith(ville.toUpperCase() + '+')) out.push(e.oeuvre_id); }
      return out;
    },
    dump() { return data; },
  };
}

async function chercherVille(nom, fetchImpl = fetch) {

/** Renvoie { meteo (format du moteur), dateISO (date locale de la ville), libelle } */
async function meteoDuJour({ lat, lon }, fetchImpl = fetch) {
  const params = new URLSearchParams({
    latitude: lat, longitude: lon, timezone: 'auto', forecast_days: '1',
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,snowfall,weather_code,cloud_cover,wind_speed_10m,is_day',
    daily: 'temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,weather_code,sunshine_duration',
  });
  const r = await fetchImpl(`https://api.open-meteo.com/v1/forecast?${params}`);
  if (!r.ok) throw new Error('météo indisponible');
  const j = await r.json();
  const c = j.current, d = j.daily;
  const meteo = {
    temp: c.temperature_2m, temp_ressentie: c.apparent_temperature,
    temp_max: d.temperature_2m_max[0], temp_min: d.temperature_2m_min[0],
    // on combine l'instant présent et le cumul du jour pour que l'œuvre reflète la journée, pas seulement l'heure de la 1re visite
    precip_mm: Math.max(c.precipitation, d.precipitation_sum[0] ?? 0),
    neige_cm: Math.max(c.snowfall ?? 0, d.snowfall_sum?.[0] ?? 0),
    nuages_pct: c.cloud_cover, vent_kmh: c.wind_speed_10m, humidite_pct: c.relative_humidity_2m,
    code_wmo: d.weather_code?.[0] ?? c.weather_code,          // code dominant de la journée
    code_wmo_actuel: c.weather_code,
    ensoleillement_h: (d.sunshine_duration?.[0] ?? 0) / 3600,
    is_day: c.is_day,
  };
  // date locale de la ville (c.time est en heure locale grâce à timezone=auto)
  const dateISO = String(c.time).slice(0, 10);
  return { meteo, dateISO, fuseau: j.timezone };
}

// Dépend de engine.js (profilMeteo, choisirOeuvre, phraseEcho).



const VILLES_DEFAUT = [
  { nom: 'Genève', lat: 46.2044, lon: 6.1432 }, { nom: 'Paris', lat: 48.8566, lon: 2.3522 }, { nom: 'Londres', lat: 51.5072, lon: -0.1276 },

];
const JOURS_HISTO = 7;

/** Une requête Open-Meteo pour plusieurs villes : 7 jours passés + aujourd'hui, quotidien + horaire. */
async function meteoVilles(villes, fetchImpl = fetch) {
  const params = new URLSearchParams({
    latitude: villes.map(v => v.lat).join(','), longitude: villes.map(v => v.lon).join(','),
    timezone: 'auto', past_days: String(JOURS_HISTO), forecast_days: '1',
    current: 'temperature_2m,weather_code,is_day',
    daily: 'temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,weather_code,wind_speed_10m_max,sunrise,sunset',
    hourly: 'temperature_2m,apparent_temperature,precipitation,snowfall,weather_code,cloud_cover,wind_speed_10m,relative_humidity_2m,is_day',
  });
  const r = await fetchImpl(`https://api.open-meteo.com/v1/forecast?${params}`);
  if (!r.ok) throw new Error('météo indisponible (' + r.status + ')');
  const j = await r.json();
  return Array.isArray(j) ? j : [j];
}

const arr = (a, i) => (a && a[i] != null) ? a[i] : null;
const moy = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const mode = xs => { const c = {}; let best = null; for (const x of xs) { c[x] = (c[x] || 0) + 1; if (best == null || c[x] > c[best]) best = x; } return best == null ? null : Number(best); };
const r1 = x => x == null ? null : Math.round(x);           // arrondi pour la stabilité entre visiteurs
const r5 = x => x == null ? null : Math.round(x * 2) / 2;

/** Bilan météo d'une période (heures locales [h0,h1[) d'un jour donné, au format attendu par profilMeteo. */
function bilan(d, jourIdx, h0, h1, periode) {
  const H = d.hourly; const t = H.time;
  const idx = []; for (let i = 0; i < t.length; i++) { const day = t[i].slice(0, 10), h = Number(t[i].slice(11, 13)); if (day === d.daily.time[jourIdx] && h >= h0 && h < h1) idx.push(i); }
  const pick = k => idx.map(i => H[k][i]).filter(x => x != null);
  const temps = pick('temperature_2m'), ress = pick('apparent_temperature');
  const precip = pick('precipitation').reduce((a, b) => a + b, 0), neige = pick('snowfall').reduce((a, b) => a + b, 0);
  const codes = pick('weather_code');
  // code dominant, mais on garde la pluie/orage/neige si présents une bonne partie du temps
  let code = mode(codes) ?? arr(d.daily.weather_code, jourIdx) ?? 3;
  const grave = codes.filter(c => c >= 51).length;
  if (grave >= Math.max(2, codes.length * 0.3)) code = Math.max(...codes.filter(c => c >= 51));
  return {
    temp: r1(moy(temps)), temp_ressentie: r1(moy(ress)),
    temp_max: r1(periode === 'jour' ? arr(d.daily.temperature_2m_max, jourIdx) : Math.max(...temps)),
    temp_min: r1(periode === 'jour' ? arr(d.daily.temperature_2m_min, jourIdx) : Math.min(...temps)),
    precip_mm: r5(precip), neige_cm: r5(neige),
    nuages_pct: Math.round((moy(pick('cloud_cover')) ?? 50) / 10) * 10,
    vent_kmh: Math.round((moy(pick('wind_speed_10m')) ?? 10) / 5) * 5,
    humidite_pct: Math.round((moy(pick('relative_humidity_2m')) ?? 60) / 10) * 10,
    code_wmo: code, is_day: periode === 'jour' ? 1 : 0,
  };
}

/** Heure locale de la ville (Open-Meteo renvoie current.time en heure locale). */
function periodeActuelle(d) {
  const now = d.current.time;                                   // 'YYYY-MM-DDTHH:MM' local
  const today = now.slice(0, 10); const i = d.daily.time.indexOf(today);
  const sunset = arr(d.daily.sunset, i);                        // 'YYYY-MM-DDTHH:MM'
  const soir = sunset ? now >= sunset : Number(now.slice(11, 13)) >= 19;
  return { dateISO: today, jourIdx: i, periode: soir ? 'soir' : 'jour', sunset };
}

/**
 * Calcule, pour une liste de villes (les 7 par défaut d'abord, puis éventuellement une ville libre),
 * l'œuvre du jour et du soir de chaque ville pour aujourd'hui, de façon déterministe.
 * @returns {Map<nomVille, {jour, soir, actuelle, meteo, dateISO}>}
 */
function calculerToutes(oeuvres, villes, donnees, fixes = {}) {
  // fixes : { 'VILLE+YYYY-MM-DD': {id, artiste, categorie, echo?} } — œuvres déjà fixées (mémoire partagée), prioritaires sur le calcul
  const byId = Object.fromEntries(oeuvres.map(o => [o.id, o]));
  const resultats = new Map();
  // journal partagé : clé VILLE+DATE+PERIODE → {id, artiste, categorie}
  const journal = new Map();
  const cle = (v, d, p) => `${v.toUpperCase()}+${d}+${p}`;

  // on avance jour par jour (du plus ancien à aujourd'hui), ville par ville, période jour puis soir
  const nbJours = donnees[0].daily.time.length;
  for (let j = 0; j < nbJours; j++) {
    for (const p of ['jour']) {
      villes.forEach((v, vi) => {
        const d = donnees[vi]; const dateISO = d.daily.time[j];
        const m = bilan(d, j, 6, 22, 'jour');
        if (m.temp == null) return;
        const profil = profilMeteo(m, dateISO, v.lat);
        const fixe = fixes[`${v.nom.toUpperCase()}+${dateISO}`];
        if (fixe && byId[fixe.id]) {
          journal.set(cle(v.nom, dateISO, p), { id: fixe.id, artiste: fixe.artiste, categorie: fixe.categorie });
          if (j === nbJours - 1) { const o = byId[fixe.id]; resultats.set(v.nom, { dateISO, jour: { oeuvre: o, profil, meteo: m, echo: fixe.echo || phraseEcho(o, profil, v.nom), niveau: 1, fixe: true } }); }
          return;
        }
        // historique de cette ville : périodes précédentes, 7 jours
        const historique = [];
        for (let k = 1; k <= JOURS_HISTO; k++) {
          const dk = new Date(new Date(dateISO + 'T00:00:00Z').getTime() - k * 86400000).toISOString().slice(0, 10);
          const e = journal.get(cle(v.nom, dk, 'jour')); if (e) historique.push({ ...e, jours: k });
        }
        // œuvres déjà attribuées aux autres villes ce jour (les deux périodes) et la veille
        const deja = [];
        for (const [k, e] of journal) { const [vv, dd] = k.split('+'); if (vv !== v.nom.toUpperCase() && (dd === dateISO)) deja.push(e.id); }
        const res = choisirOeuvre(oeuvres, profil, { ville: v.nom, dateISO, latitude: v.lat, historique, dejaAujourdhui: deja });
        journal.set(cle(v.nom, dateISO, p), { id: res.oeuvre.id, artiste: res.oeuvre.artiste, categorie: res.oeuvre.categorie });
        if (j === nbJours - 1) {
          const r = resultats.get(v.nom) ?? { dateISO };
          r[p] = { oeuvre: res.oeuvre, profil, meteo: m, echo: phraseEcho(res.oeuvre, profil, v.nom), niveau: res.niveau };
          resultats.set(v.nom, r);
        }
      });
    }
  }
  villes.forEach((v, vi) => { const r = resultats.get(v.nom); if (r) { r.periode = 'jour'; r.current = donnees[vi].current; r.actuelle = r.jour; } });
  return resultats;
}

function fondSombre(hex){ // garde la teinte de l'œuvre, force une luminosité basse et une saturation douce
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b); let h=0,s=0; const l=(max+min)/2;
  if(max!==min){ const d=max-min; s=l>.5?d/(2-max-min):d/(max+min); h=max===r?((g-b)/d+(g<b?6:0)):max===g?((b-r)/d+2):((r-g)/d+4); h/=6; }
  // « un peu sombre tout le temps », teinté par l'œuvre
  const S=Math.min(s*0.8,.4), L=Math.max(.17,Math.min(.24,l*0.45)); const q=L<.5?L*(1+S):L+S-L*S, p=2*L-q;
  const f=t=>{ t=(t+1)%1; return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p; };
  const to=x=>Math.round(x*255).toString(16).padStart(2,'0');
  return '#'+to(f(h+1/3))+to(f(h))+to(f(h-1/3));
}

    dateISO=new Date().toISOString().slice(0,10);
    const res=choisirOeuvre(OEUVRES, null, {ville:ville.nom, dateISO, latitude:ville.lat, historique:[]}); o=res.oeuvre; echo=phraseEcho(o, res.profil, ville.nom);
  }
  const fond=fondSombre(o.fond_couleur); document.body.style.background=fond; document.body.classList.toggle('dark',lum(fond)<.3);
  const tempNow = cur && cur.temperature_2m!=null ? Math.round(cur.temperature_2m) : (mm ? mm.temp : null);
  const codeNow = cur && cur.weather_code!=null ? cur.weather_code : (mm ? mm.code_wmo : null);
  const meteoTxt = mm ? `<b>${tempNow}°</b> · ${(WMO_LABELS_FR[codeNow]||'').toLowerCase()}` : `<span>météo indisponible · choix de saison</span><br><span style="opacity:.6;font-size:.8em;letter-spacing:.04em">(${(err||'raison inconnue').replace(/</g,'&lt;')})</span>`;
  document.getElementById('scene').innerHTML=`
    <div class="art"><img id="img" referrerpolicy="no-referrer" src="${imgSrc(o)}" alt="${o.titre} — ${o.artiste}"></div>
    <div class="titre"><h1>${o.titre}</h1><p class="meta">${o.artiste}, ${o.annee}</p>${o.mouvement_artistique?`<p class="meta mvt">${o.mouvement_artistique}</p>`:``}</div>
    <div class="cap meteo">${ville.nom} · ${dateFR(dateISO)} · ${meteoTxt}</div>
    <a class="down" href="#lire" aria-label="Lire"></a>`;
  const img=document.getElementById('img'); const on=()=>img.classList.add('on'); img.onload=on; if(img.complete) on();
  const srcs=imgSrcs(o); let k=0;
  img.onerror=()=>{ if(++k<srcs.length){ img.src=srcs[k]; return; } const d=document.createElement('div'); d.className='ph'; d.style.display='flex'; d.style.alignItems='center'; d.style.justifyContent='center'; d.style.padding='20px'; d.innerHTML='<span class="cap" style="font-size:.8rem">image du musée non chargée<br>'+img.src.replace(/^https?:\/\/([^/]+).*$/,'$1')+'</span>'; img.replaceWith(d); };
  const liens=[]; if(o.wikipedia_oeuvre) liens.push(`<a href="${o.wikipedia_oeuvre}" target="_blank" rel="noopener">Découvrir l’œuvre sur Wikipédia</a>`); if(o.wikipedia_artiste) liens.push(`<a href="${o.wikipedia_artiste}" target="_blank" rel="noopener">Découvrir l’artiste sur Wikipédia</a>`);
  const autre='';
  document.getElementById('lire').innerHTML=`<div class="texte"><p>${o.texte}</p><p class="echo">${echo}</p></div><div class="cap liens">${liens.join('')}</div>${autre}`;
  document.getElementById('foot').innerHTML=`${o.musee} · Image : ${o.image.source}, ${o.image.licence} (<a href="${o.image.page_source}" target="_blank" rel="noopener">notice du musée</a>) · Météo : Open-Meteo`;
  etat('',false);
  document.title=`${o.titre} — Weather Art`;
}
function setTypo(t){ typo=t; LS.set('adj.typo',t); document.body.classList.toggle('sans',t==='sans'); document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',(b.id==='tSans')===(t==='sans'))); }
function accueil(){
  const a=document.getElementById('accueil');
  document.getElementById('accVilles').innerHTML=VILLES_DEFAUT.map(v=>`<button data-v="${v.nom}">${v.nom}</button>`).join('');
  document.getElementById('accVilles').querySelectorAll('button').forEach(b=>b.onclick=()=>{ choisir(VILLES_DEFAUT.find(v=>v.nom===b.dataset.v)); a.classList.add('off'); });
  if (ville && !VILLES_DEFAUT.find(v=>v.nom===ville.nom)) { const r=document.getElementById('accRes'); r.innerHTML=`<button data-last="1">${ville.nom}</button>`; r.querySelector('button').onclick=()=>{ choisir(ville); a.classList.add('off'); }; }
  const inp=document.getElementById('accRech'); let t;
  inp.oninput=()=>{ clearTimeout(t); const q=inp.value.trim(); const res=document.getElementById('accRes'); if(q.length<2){res.innerHTML='';return;}
    t=setTimeout(async()=>{ try{ const r=await chercherVille(q); res.innerHTML=r.slice(0,5).map((v,i)=>`<button data-i="${i}">${v.nom}${v.pays?' · '+v.pays:''}</button>`).join('')||'<button disabled>Aucune ville trouvée</button>';
      res.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{ const v=r[+b.dataset.i]; const nv={nom:v.nom,lat:v.lat,lon:v.lon}; choisir(nv); a.classList.add('off'); });
    }catch(e){ res.innerHTML='<button disabled>Recherche indisponible</button>'; } },350); };
  a.classList.remove('off');
}
// la page d'accueil s'affiche à chaque ouverture ; la dernière ville choisie est mise en avant
accueil();
if (ville) { const b=[...document.querySelectorAll('#accVilles button')].find(b=>b.dataset.v===ville.nom); if(b) b.style.borderColor='var(--ink)'; document.getElementById('villeBtn').textContent=ville.nom; }
// retour à l'accueil par le nom du site
document.getElementById('brand').style.cursor='pointer';
document.getElementById('brand').onclick=()=>accueil();
</script></body></html>
